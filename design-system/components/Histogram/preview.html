<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><style>body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font-family:var(--font-body)}.col{max-width:520px}</style></head>
<body>
<div id="root" class="col"></div>
<script>
  var Q = window.QuickGames, h = React.createElement;

</script>
</body>
</html>
