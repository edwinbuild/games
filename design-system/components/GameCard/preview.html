<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><style>body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font-family:var(--font-body)}.col{max-width:560px;display:grid;gap:12px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style></head>
<body>
<div id="root" class="col"></div>
<script>
  var Q = window.QuickGames, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px, 1fr))', gap:12}},
    h(Q.GameCard, {title:'Blind Timer', tagline:'Stop a hidden clock at exactly the target time.', href:'#', color:'tangerine', sample:'07.30', daily:true, status:'Played today · 5 day streak', done:true}),
    h(Q.GameCard, {title:'Reaction Chain', tagline:'Tap the instant the colour changes.', href:'#', color:'mint', sample:'243ms', status:'Played 4 times'})));
</script>
</body>
</html>
