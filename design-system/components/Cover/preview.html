<!-- @dsCard height=320 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--canvas); }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; background: var(--canvas); }
  svg { position: absolute; inset: 0; }
  .ticket { fill: var(--ticket); } .tangerine { fill: var(--tangerine); } .mint { fill: var(--mint); } .sky { fill: var(--sky); }
  .grape { fill: var(--grape); }
  .shadow { fill: var(--drop); } .ground { fill: var(--canvas); }
  .edge { stroke: var(--edge); stroke-width: var(--border-edge); }
  .perf { stroke: var(--on-fill); stroke-width: var(--border-edge); stroke-dasharray: 6 8; fill: none; }
  .r-lg { rx: var(--radius-lg); } .r-md { rx: var(--radius-md); } .pill { rx: 24px; }
  .text { position: absolute; left: 48px; bottom: 40px; width: 420px; }
  .name { margin: 0; font: 800 112px/0.92 var(--font-display); letter-spacing: -0.04em; color: var(--ink); }
  .tag { margin: 16px 0 0; font: 500 14px/20px var(--font-body); color: var(--ink-muted); }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
    <!-- blocks: ticket 300x176 (radius-lg) as the slab; tangerine 120x136 and mint 120x112 bleeding off the right edge; sky pill 208x48; one grape 48x48 (radius-md)
         arrangement: one tall slab with satellites, every block sitting on its hard ink offset (shadow-card, 6px) like the site's cards
         pattern: the literal ticket motif, because the README calls the look an arcade ticket counter: half-circle notches cut from the slab in the ground colour and a dashed perforation (border-edge, dash 6/8)
         steps and radii: gaps space-5 (20) and space-6 (32), radius-lg 20, radius-md 12, pill = half of 48 -->
    <rect class="shadow r-md" x="852" y="-20" width="128" height="136" />
    <rect class="tangerine edge r-md" x="846" y="-26" width="128" height="136" />
    <rect class="shadow r-md" x="852" y="136" width="128" height="112" />
    <rect class="mint edge r-md" x="846" y="130" width="128" height="112" />

    <rect class="shadow r-lg" x="520" y="54" width="300" height="176" />
    <rect class="ticket edge r-lg" x="514" y="48" width="300" height="176" />
    <circle class="ground edge" cx="514" cy="136" r="18" />
    <circle class="ground edge" cx="814" cy="136" r="18" />
    <rect class="ground" x="490" y="112" width="23" height="48" />
    <rect class="ground" x="815" y="112" width="23" height="48" />
    <line class="perf" x1="610" y1="64" x2="610" y2="208" />
    <rect class="perf" style="stroke-dasharray:none" x="640" y="96" width="140" height="8" rx="4" />
    <rect class="perf" style="stroke-dasharray:none" x="640" y="132" width="100" height="8" rx="4" />
    <rect class="perf" style="stroke-dasharray:none" x="640" y="168" width="140" height="8" rx="4" />

    <rect class="shadow pill" x="560" y="262" width="208" height="48" />
    <rect class="sky edge pill" x="554" y="256" width="208" height="48" />
    <rect class="shadow r-md" x="792" y="262" width="48" height="48" />
    <rect class="grape edge r-md" x="786" y="256" width="48" height="48" />
  </svg>
  <div class="text">
    <p class="name">Quick<br>Games</p>
    <p class="tag">Tiny original games. Under 2 minutes. No sign-up.</p>
  </div>
</div>
</body>
</html>
