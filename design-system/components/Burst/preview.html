<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><style>body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font-family:var(--font-body)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frozen .qg-burst-dot{animation-play-state:paused!important;animation-delay:-260ms!important}.box{position:relative;height:140px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);display:grid;place-items:center;font:700 28px var(--font-display)}</style></head>
<body>
<div id="root"></div>
<script>
  var Q = window.QuickGames, h = React.createElement;
  function Demo() { var s = React.useState(0); React.useEffect(function () { var t = setInterval(function () { s[1](function (k) { return k + 1 }) }, 1600); return function () { clearInterval(t) } }, []); return h('div', { className: 'row' }, h('div', { className: 'box frozen' }, 'New best!', h(Q.Burst, { color: 'honey' })), h('div', { className: 'box' }, 'Again', h(Q.Burst, { key: s[0], color: 'lilac' }))) }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
