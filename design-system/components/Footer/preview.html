<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title><style>body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font-family:var(--font-body)}.col{display:grid;gap:12px}.narrow{max-width:380px}</style></head>
<body>
<div id="root" class="col"></div>
<script>
  var Q = window.QuickGames, h = React.createElement;
  function F() { return h(Q.Footer, { siteName: 'Pocket Fair', credit: { label: 'edwinsm.me', href: '#' }, links: [{ label: 'All games', href: '#' }, { label: 'About', href: '#' }], note: h(Q.Segmented, { label: 'Theme', value: 'auto', onChange: function () {}, options: [{ value: 'auto', label: 'Auto' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }] }) }) }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h('div', null, h(F)), h('div', { className: 'narrow' }, h(F))));
</script>
</body>
</html>
